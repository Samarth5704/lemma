name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run contrast
      - run: npm run allowlist
      - name: README has no unrewritten passages
        run: |
          if grep -nF '[REWRITE' README.md; then
            echo "::error file=README.md::README.md still contains [REWRITE markers"
            exit 1
          fi
